<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hymn Display — Bottom</title>
<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  background:transparent;
  overflow:hidden;
}

body{
  font-family:"Segoe UI",Arial,sans-serif;
  color:#fff;
}

#bottom-bg{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  height:100%;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.2) 0%,
      rgba(0,0,0,0.55) 50%,
      rgba(0,0,0,0.85) 100%
    );
  pointer-events:none;
}

#stage{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4vh 4vw;
  box-sizing:border-box;
}

#card{
  width:min(var(--max-width,1500px),100%);
  text-align:var(--align,center);
  opacity:0;
  transform:translateY(14px);
  transition:opacity .18s ease,transform .18s ease;
  text-shadow:
    0 3px 12px rgba(0,0,0,.95),
    0 1px 4px rgba(0,0,0,1);
}

#card.live{
  opacity:1;
  transform:translateY(0);
}

/* Theme Presets */
#card.theme-glass{
  background: rgba(18, 22, 31, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 18px;
  padding: 28px 36px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.5);
}
#card.theme-gold #meta, #card.theme-gold #title{
  color: #f5c518;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
}
#card.theme-contrast{
  background: #000000;
  color: #ffffff;
  padding: 24px 32px;
  border-radius: 12px;
  border: 2px solid #333333;
}

#meta{
  font-size:20px;
  font-weight:700;
  letter-spacing:.04em;
  margin-bottom:5px;
  text-transform:uppercase;
}

#title{
  font-size:25px;
  font-weight:700;
  margin-bottom:8px;
}

#section{
  font-size:18px;
  font-weight:600;
  margin-bottom:5px;
}

#linebox{
  font-size:var(--font-size,58px);
  line-height:var(--line-height,1.28);
  font-weight:600;
  white-space:normal;
}

@media(max-width:1100px){
  #linebox{font-size:46px}
  #title{font-size:22px}
  #meta{font-size:17px}
}

@media(max-width:700px){
  #linebox{font-size:34px}
  #title{font-size:18px}
  #meta{font-size:14px}
}
</style>
</head>
<body>

<div id="bottom-bg"></div>

<div id="stage">
  <div id="card">
    <div id="meta"></div>
    <div id="title"></div>
    <div id="section"></div>
    <div id="linebox"></div>
  </div>
</div>

<script>
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function loadFont(fontName) {
  if (!fontName || fontName === "Segoe UI") {
    document.body.style.fontFamily = '"Segoe UI", Arial, sans-serif';
    return;
  }
  const id = "gfont-" + fontName.replace(/\s+/g, "-");
  if (!document.getElementById(id)) {
    const link = document.createElement("link");
    link.id = id;
    link.rel = "stylesheet";
    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;600;700;800&display=swap`;
    document.head.appendChild(link);
  }
  document.body.style.fontFamily = `'${fontName}', "Segoe UI", sans-serif`;
}

function applyState(d) {
  const state = d.state;
  const hymn = state.hymn;
  const card = document.getElementById("card");

  if (!hymn || !state.section || state.stanza == null) {
    card.className = "";
    return;
  }

  const stanzas = hymn.sections[state.section] || [];
  const stanza = stanzas.find(item => Number(item.number) === Number(state.stanza));
  if (!stanza) { card.className = ""; return; }

  const settings = state.settings || {};

  document.getElementById("meta").textContent =
    settings.show_hymn_number ? "HYMN " + (hymn.number ?? "") : "";

  document.getElementById("title").textContent =
    settings.show_title ? (hymn.title || "") : "";

  document.getElementById("section").textContent =
    settings.show_section ? state.section + " • VERSE " + state.stanza : "";

  document.getElementById("linebox").innerHTML =
    stanza.lines.map(escapeHtml).join("<br>");

  document.documentElement.style.setProperty(
    "--font-size", (Number(settings.font_size) || 58) + "px"
  );
  document.documentElement.style.setProperty(
    "--max-width", (Number(settings.max_width) || 1500) + "px"
  );
  document.documentElement.style.setProperty(
    "--line-height", Number(settings.line_height) || 1.28
  );
  document.documentElement.style.setProperty(
    "--align", settings.text_align || "center"
  );

  loadFont(settings.font_family);

  const themeClass = settings.theme ? "theme-" + settings.theme : "theme-minimal";
  card.className = "live " + themeClass;

  if (settings.bg_image) {
    document.body.style.backgroundImage = `url("${settings.bg_image}")`;
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
  } else {
    document.body.style.backgroundImage = "none";
  }
}

// Read session from URL: /display_bottom?session=abc123 (defaults to 'default')
const params = new URLSearchParams(window.location.search);
const SESSION = params.get("session") || "default";

function connect() {
  const es = new EventSource("/api/v1/state/events?session=" + encodeURIComponent(SESSION));

  es.onmessage = e => {
    try { applyState(JSON.parse(e.data)); } catch {}
  };

  es.onerror = () => {
    es.close();
    setTimeout(connect, 3000);
  };
}

connect();
</script>

</body>
</html>
