<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hymn Dock</title>
<style>
:root{--bg:#171a21;--panel:#20242d;--line:#343a48;--text:#f1f3f7;--muted:#aeb5c2;--accent:#6ea8fe;--good:#54d38a;--danger:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;font-size:14px}
.wrap{padding:12px;max-width:900px;margin:auto}
h1{font-size:19px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px}
.row{display:flex;gap:7px;align-items:center}
input,button,select{font:inherit}
input,select{background:#11141a;color:var(--text);border:1px solid #464d5d;border-radius:6px;padding:8px}
input{width:100%}
button{border:0;border-radius:6px;padding:8px 11px;background:#3b4252;color:white;cursor:pointer}
button:hover{background:#4a5366}
button.primary{background:#3268b5}
button.primary:hover{background:#3e79cc}
button.active{background:#2f9e68}
button.danger{background:#7d3e47}
button.warning{background:#7a6200}
.small{color:var(--muted);font-size:12px}
.status{margin-top:8px;color:var(--muted);min-height:18px}
.status.good{color:var(--good)}
.status.error{color:var(--danger)}
.hymn-title{font-size:16px;font-weight:700;margin-bottom:2px}
.section{margin-top:12px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.section-name{font-weight:700;color:#dbe5f7}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.grid button{padding:9px 4px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setting{display:flex;align-items:center;gap:7px}
.setting label{min-width:95px;color:var(--muted)}
.setting input[type=number]{width:90px}
.setting input[type=checkbox]{width:auto}
@media(max-width:520px){.grid{grid-template-columns:repeat(5,1fr)}.settings{grid-template-columns:1fr}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Hymn Dock</h1>

  <!-- Session info -->
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">Session / Room</div>
    <div class="row">
      <input id="sessionInput" value="default" placeholder="e.g. default, main, room1" style="max-width:180px">
      <button id="copyDisplay" title="Copy OBS display URL to clipboard">📋 Copy Display URL</button>
      <button id="copyBottom" title="Copy OBS bottom display URL to clipboard">📋 Copy Bottom URL</button>
    </div>
    <div class="small" style="margin-top:6px">Zero setup: OBS URL is simply <code>/display</code> or <code>/display_bottom</code>. Only change the session name if running multiple separate rooms on one server.</div>
  </div>

  <!-- Hymn search -->
  <div class="card">
    <div class="row">
      <input id="number" inputmode="numeric" placeholder="Enter hymn number, e.g. 235">
      <button class="primary" id="load">LOAD</button>
    </div>
    <div class="row" style="margin-top:7px">
      <input id="url" placeholder="Or paste a Treasure Hymns hymn URL">
      <button id="loadUrl">URL</button>
    </div>
    <div id="status" class="status">Ready.</div>
  </div>

  <!-- Hymn stanza picker -->
  <div class="card" id="hymnCard" hidden>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <div class="hymn-title" id="title" style="flex:1"></div>
      <button class="warning" id="refresh" title="Force re-scrape this hymn from the website">🔄 Refresh</button>
    </div>
    <div class="small" id="source"></div>
    <div id="sections"></div>
    <div class="row" style="margin-top:10px">
      <button id="prev">← Previous</button>
      <button id="next">Next →</button>
      <button class="danger" id="clear" style="margin-left:auto">CLEAR DISPLAY</button>
    </div>
  </div>

  <!-- Display settings -->
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">Display Settings</div>
    <div class="settings">
      <div class="setting"><label>Title</label><input id="showTitle" type="checkbox" checked></div>
      <div class="setting"><label>Hymn number</label><input id="showNumber" type="checkbox" checked></div>
      <div class="setting"><label>Section</label><input id="showSection" type="checkbox"></div>
      <div class="setting"><label>Font size</label><input id="fontSize" type="number" min="20" max="120" value="58"></div>
      <div class="setting"><label>Max width</label><input id="maxWidth" type="number" min="500" max="2200" value="1500"></div>
      <div class="setting"><label>Line height</label><input id="lineHeight" type="number" min="1" max="2" step="0.05" value="1.35"></div>
      <div class="setting"><label>Alignment</label>
        <select id="align"><option value="center">Center</option><option value="left">Left</option><option value="right">Right</option></select>
      </div>
    </div>
  </div>

  <div class="small" style="padding:2px 3px">
    Tip: Load a hymn, then click a stanza. The OBS Browser Source updates instantly.
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SESSION_KEY = "hymnDockSessionName";

let SESSION_ID = localStorage.getItem(SESSION_KEY) || "default";
$("sessionInput").value = SESSION_ID;

$("sessionInput").onchange = () => {
  SESSION_ID = $("sessionInput").value.trim() || "default";
  $("sessionInput").value = SESSION_ID;
  localStorage.setItem(SESSION_KEY, SESSION_ID);
  status("Switched to session: " + SESSION_ID, "good");
  restoreState();
};

function getOrigin() {
  return window.location.origin;
}

$("copyDisplay").onclick = () => {
  const url = `${getOrigin()}/display?session=${SESSION_ID}`;
  navigator.clipboard.writeText(url).then(() => status("Display URL copied! Paste into OBS.", "good")).catch(() => {
    prompt("Copy this URL:", url);
  });
};

$("copyBottom").onclick = () => {
  const url = `${getOrigin()}/display_bottom?session=${SESSION_ID}`;
  navigator.clipboard.writeText(url).then(() => status("Bottom URL copied! Paste into OBS.", "good")).catch(() => {
    prompt("Copy this URL:", url);
  });
};

// ── Helpers ─────────────────────────────────────────────────────────────────
let hymn = null;

function status(msg, kind="") {
  $("status").textContent = msg;
  $("status").className = "status " + kind;
}

async function api(url, opts={}) {
  const sep = url.includes("?") ? "&" : "?";
  const r = await fetch(url + sep + "session=" + encodeURIComponent(SESSION_ID), opts);
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || "Request failed");
  return data;
}

// ── Hymn loading ─────────────────────────────────────────────────────────────

async function loadHymn(params, fromCache=false) {
  status(fromCache ? "Loading from cache…" : "Loading (first time may take a few seconds)…");
  try {
    const qs = new URLSearchParams(params).toString();
    const data = await api("/api/v1/hymn?" + qs);
    hymn = data.hymn;
    renderHymn();
    status("Loaded: " + hymn.title, "good");
  } catch(e) {
    status(e.message, "error");
  }
}

function renderHymn() {
  if (!hymn) return;
  $("hymnCard").hidden = false;
  $("title").textContent = hymn.title;
  $("source").textContent = hymn.url;
  const container = $("sections");
  container.innerHTML = "";
  for (const [name, stanzas] of Object.entries(hymn.sections)) {
    const sec = document.createElement("div");
    sec.className = "section";
    const head = document.createElement("div");
    head.className = "section-head";
    const nameEl = document.createElement("span");
    nameEl.className = "section-name";
    nameEl.textContent = name;
    head.appendChild(nameEl);
    sec.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const stanza of stanzas) {
      const btn = document.createElement("button");
      btn.textContent = stanza.number;
      btn.title = stanza.lines.join("\n");
      btn.id = `stanza-${name}-${stanza.number}`;
      btn.onclick = () => selectStanza(name, stanza.number, btn);
      grid.appendChild(btn);
    }
    sec.appendChild(grid);
    container.appendChild(sec);
  }
}

let activeBtn = null;

async function selectStanza(section, number, btn) {
  if (activeBtn) activeBtn.classList.remove("active");
  activeBtn = btn;
  btn.classList.add("active");
  try {
    await api("/api/v1/state", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({hymn, section, stanza: number})
    });
  } catch(e) {
    status("State update failed: " + e.message, "error");
  }
}

async function clearDisplay() {
  try {
    await api("/api/v1/state", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({hymn: null, section: null, stanza: null})
    });
    if (activeBtn) activeBtn.classList.remove("active");
    activeBtn = null;
    status("Display cleared.", "good");
  } catch(e) {
    status("Clear failed: " + e.message, "error");
  }
}

async function pushSettings() {
  const settings = {
    show_title: $("showTitle").checked,
    show_hymn_number: $("showNumber").checked,
    show_section: $("showSection").checked,
    font_size: Number($("fontSize").value),
    max_width: Number($("maxWidth").value),
    line_height: Number($("lineHeight").value),
    text_align: $("align").value
  };
  try {
    await api("/api/v1/state", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({settings})
    });
  } catch(e) {}
}

async function navigate(dir) {
  if (!hymn) return;
  const url = dir === "prev" ? hymn.previous : hymn.next;
  if (!url) { status("No " + dir + " hymn.", "error"); return; }
  await loadHymn({url});
}

// ── Refresh (cache bust) ──────────────────────────────────────────────────────

$("refresh").onclick = async () => {
  if (!hymn) return;
  status("Re-fetching hymn from website…");
  try {
    const r = await fetch(
      "/api/v1/hymn/cache?session=" + encodeURIComponent(SESSION_ID) +
      "&url=" + encodeURIComponent(hymn.url),
      { method: "DELETE" }
    );
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    hymn = data.hymn;
    renderHymn();
    status("Refreshed: " + hymn.title, "good");
  } catch(e) {
    status("Refresh failed: " + e.message, "error");
  }
};

// ── Event listeners ───────────────────────────────────────────────────────────

$("load").onclick = () => {
  const n = $("number").value.trim();
  if (!n) { status("Enter a hymn number.", "error"); return; }
  loadHymn({number: n});
};
$("loadUrl").onclick = () => {
  const u = $("url").value.trim();
  if (!u) { status("Enter a URL.", "error"); return; }
  loadHymn({url: u});
};
$("prev").onclick = () => navigate("prev");
$("next").onclick = () => navigate("next");
$("clear").onclick = clearDisplay;

["showTitle","showNumber","showSection","fontSize","maxWidth","lineHeight","align"].forEach(id => {
  $(id).addEventListener("change", pushSettings);
});

// ── Restore state on load ─────────────────────────────────────────────────────

async function restoreState() {
  try {
    const data = await api("/api/v1/state");
    const s = data.state.settings;
    if (s) {
      $("showTitle").checked = s.show_title ?? true;
      $("showNumber").checked = s.show_hymn_number ?? true;
      $("showSection").checked = s.show_section ?? false;
      $("fontSize").value = s.font_size ?? 58;
      $("maxWidth").value = s.max_width ?? 1500;
      $("lineHeight").value = s.line_height ?? 1.35;
      $("align").value = s.text_align ?? "center";
    }
    if (data.state.hymn) {
      hymn = data.state.hymn;
      renderHymn();
    } else {
      $("hymnCard").hidden = true;
    }
  } catch(e) {}
}

restoreState();
</script>
</body>
</html>
