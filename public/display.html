<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hymn Display</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:"Segoe UI",Arial,sans-serif;color:white}
#stage{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:3vh 3vw;box-sizing:border-box}
#card{width:min(var(--max-width,1500px),100%);text-align:var(--align,center);text-shadow:0 3px 12px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,1);opacity:0;transform:translateY(10px);transition:opacity .18s ease,transform .18s ease}
#card.live{opacity:1;transform:translateY(0)}
#meta{font-size:22px;font-weight:600;letter-spacing:.03em;margin-bottom:8px}
#title{font-size:28px;font-weight:700;margin-bottom:12px}
#section{font-size:20px;font-weight:600;margin-bottom:5px}
#linebox{font-size:var(--font-size,58px);line-height:var(--line-height,1.35);font-weight:600;white-space:normal}
@media(max-width:900px){#linebox{font-size:44px}#title{font-size:24px}#meta{font-size:18px}}
</style>
</head>
<body>
<div id="stage"><div id="card">
  <div id="meta"></div>
  <div id="title"></div>
  <div id="section"></div>
  <div id="linebox"></div>
</div></div>
<script>
const $ = id => document.getElementById(id);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function applyState(d) {
  const s = d.state;
  const h = s.hymn;

  if (!h || !s.section || s.stanza == null) {
    $("card").classList.remove("live");
    return;
  }

  const stanzas = h.sections[s.section] || [];
  const st = stanzas.find(x => Number(x.number) === Number(s.stanza));
  if (!st) { $("card").classList.remove("live"); return; }

  const set = s.settings || {};

  $("meta").textContent = set.show_hymn_number ? "HYMN " + (h.number ?? "") : "";
  $("title").textContent = set.show_title ? (h.title || "") : "";
  $("section").textContent = set.show_section ? s.section + " • VERSE " + s.stanza : "";
  $("linebox").innerHTML = st.lines.map(escapeHtml).join("<br>");

  document.documentElement.style.setProperty("--font-size", (Number(set.font_size) || 58) + "px");
  document.documentElement.style.setProperty("--max-width", (Number(set.max_width) || 1500) + "px");
  document.documentElement.style.setProperty("--line-height", Number(set.line_height) || 1.35);
  document.documentElement.style.setProperty("--align", set.text_align || "center");
  $("card").classList.add("live");
}

// Read session from URL: /display?session=abc123 (defaults to 'default')
const params = new URLSearchParams(window.location.search);
const SESSION = params.get("session") || "default";

function connect() {
  const es = new EventSource("/api/v1/state/events?session=" + encodeURIComponent(SESSION));

  es.onmessage = e => {
    try { applyState(JSON.parse(e.data)); } catch {}
  };

  es.onerror = () => {
    es.close();
    setTimeout(connect, 3000);
  };
}

connect();
</script>
</body>
</html>
